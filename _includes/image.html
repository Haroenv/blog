<figure class="{% if include.zoomable %}zoomable-image-container{% endif %}">
  <img alt="{{include.alt}}" src="{{site.baseurl}}/img/posts{{page.url}}/{{include.img}}" class="{% if include.zoomable %}zoomable-image{% endif %}" />
  {% if include.zoomable %}
    <button class="zoom-button" aria-label="Open fullscreen" title="Open fullscreen">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  {% endif %}
  {% if include.caption %}
    <figcaption>{{include.caption}}</figcaption>
  {% elsif include.alt %}
    <figcaption>{{include.alt}}</figcaption>
  {% endif %}
</figure>
