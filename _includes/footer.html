<!-- Fullscreen Image Modal -->
<div id="image-fullscreen-modal" class="image-modal" style="display: none;">
  <div class="image-modal-overlay"></div>
  <button class="image-modal-close" aria-label="Close fullscreen">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
  <div class="image-modal-content">
    <div class="image-modal-zoom-container">
      <img class="image-modal-img" src="" alt="" />
    </div>
  </div>
  <div class="image-modal-caption"></div>
  <div class="image-modal-controls">
    <button class="zoom-control" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
    <button class="zoom-control" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
    <button class="zoom-control" data-action="reset" aria-label="Reset zoom" title="Reset">↺</button>
  </div>
</div>

{% raw %}
<script>
(function() {
  'use strict';
  
  const modal = document.getElementById('image-fullscreen-modal');
  const modalImg = modal.querySelector('.image-modal-img');
  const modalCaption = modal.querySelector('.image-modal-caption');
  const modalClose = modal.querySelector('.image-modal-close');
  const modalOverlay = modal.querySelector('.image-modal-overlay');
  const zoomContainer = modal.querySelector('.image-modal-zoom-container');
  
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let lastX = 0;
  let lastY = 0;
  let animationFrameId = null;
  
  function constrainTranslation() {
    if (scale <= 1) {
      translateX = 0;
      translateY = 0;
      return;
    }
    
    const containerRect = zoomContainer.getBoundingClientRect();
    const imgRect = modalImg.getBoundingClientRect();
    
    /* Calculate the scaled image dimensions */
    const scaledWidth = imgRect.width;
    const scaledHeight = imgRect.height;
    
    /* Calculate maximum allowed translation */
    const maxTranslateX = Math.max(0, (scaledWidth - containerRect.width) / 2);
    const maxTranslateY = Math.max(0, (scaledHeight - containerRect.height) / 2);
    
    /* Constrain translation within bounds */
    translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
    translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
  }
  
  function updateTransform() {
    if (animationFrameId) {
      cancelAnimationFrame(animationFrameId);
    }
    animationFrameId = requestAnimationFrame(() => {
      constrainTranslation();
      modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      animationFrameId = null;
    });
  }
  
  function resetZoom() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    updateTransform();
  }
  
  function zoomIn() {
    scale = Math.min(scale * 1.3, 5);
    updateTransform();
  }
  
  function zoomOut() {
    scale = Math.max(scale / 1.3, 0.5);
    if (scale === 1) {
      translateX = 0;
      translateY = 0;
    }
    updateTransform();
  }
  
  function openModal(img, caption) {
    modalImg.src = img.src;
    modalImg.alt = img.alt;
    modalCaption.textContent = caption || '';
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    resetZoom();
  }
  
  function closeModal() {
    modal.style.display = 'none';
    document.body.style.overflow = '';
    resetZoom();
  }
  
  /* Add click handlers to zoom buttons */
  document.querySelectorAll('.zoom-button').forEach(button => {
    button.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const container = button.closest('.zoomable-image-container');
      const img = container.querySelector('.zoomable-image');
      const caption = container.querySelector('figcaption');
      openModal(img, caption ? caption.textContent : '');
    });
  });
  
  /* Close modal handlers */
  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', closeModal);
  
  /* Escape key to close */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.style.display === 'flex') {
      closeModal();
    }
  });
  
  /* Zoom controls */
  modal.querySelectorAll('.zoom-control').forEach(button => {
    button.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = button.dataset.action;
      if (action === 'zoom-in') zoomIn();
      else if (action === 'zoom-out') zoomOut();
      else if (action === 'reset') resetZoom();
    });
  });
  
  /* Mouse wheel zoom */
  zoomContainer.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.deltaY < 0) {
      zoomIn();
    } else {
      zoomOut();
    }
  }, { passive: false });
  
  /* Pan functionality - Mouse */
  zoomContainer.addEventListener('mousedown', (e) => {
    if (scale > 1) {
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      lastX = e.clientX;
      lastY = e.clientY;
    }
  });
  
  document.addEventListener('mousemove', (e) => {
    if (isDragging) {
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    }
  });
  
  document.addEventListener('mouseup', () => {
    isDragging = false;
  });
  
  /* Pan functionality - Touch */
  let initialDistance = 0;
  let initialScale = 1;
  
  zoomContainer.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      /* Single touch - pan */
      isDragging = true;
      startX = e.touches[0].clientX - translateX;
      startY = e.touches[0].clientY - translateY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      /* Two fingers - pinch zoom */
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      initialDistance = Math.sqrt(dx * dx + dy * dy);
      initialScale = scale;
    }
  });
  
  zoomContainer.addEventListener('touchmove', (e) => {
    e.preventDefault();
    
    if (e.touches.length === 1 && isDragging && scale > 1) {
      /* Single touch - pan */
      translateX = e.touches[0].clientX - startX;
      translateY = e.touches[0].clientY - startY;
      updateTransform();
    } else if (e.touches.length === 2) {
      /* Two fingers - pinch zoom */
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      scale = Math.max(0.5, Math.min(5, initialScale * (distance / initialDistance)));
      updateTransform();
    }
  }, { passive: false });
  
  zoomContainer.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      isDragging = false;
    }
  });
  
  /* Double tap to zoom on mobile */
  let lastTap = 0;
  zoomContainer.addEventListener('touchend', (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      if (scale === 1) {
        scale = 2.5;
      } else {
        resetZoom();
      }
      updateTransform();
    }
    lastTap = currentTime;
  });
})();
</script>
{% endraw %}
